<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テストページ</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
    line-height: 1.6;
  }
  h1 {
    color: #333;
  }
  button {
    padding: 8px 16px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>テスト用HTMLページ</h1>
  <p>これはシンプルなテストページです。</p>
  <button onclick="document.getElementById('output').textContent = 'クリックされました！'">クリックしてね</button>
  <p id="output"></p>
</body>
</html>
